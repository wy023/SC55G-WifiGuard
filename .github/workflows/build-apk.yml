name: Build installable APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: "8.9"
  JAVA_VERSION: "17"

jobs:
  build-debug-apk:
    name: Test and build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-cleanup: on-success

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build and test
        shell: bash
        run: bash scripts/cloud-build.sh

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SC55G-WifiGuard-debug-${{ github.run_number }}
          path: |
            dist/SC55G-WifiGuard-v1.0.0-debug.apk
            dist/SC55G-WifiGuard-v1.0.0-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload unit-test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ github.run_number }}
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14
